<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    ServerName kisia-shop-secure.koreasouth.cloudapp.azure.com
    DocumentRoot /var/www/html

    # HTTP 요청을 HTTPS로 리디렉션
    Redirect permanent / https://kisia-shop-secure.koreasouth.cloudapp.azure.com/

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
